name: Build LawOfflineAI APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          sdkmanager "ndk;27.2.12479018"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check project
        run: |
          echo "Checking project..."
          ls -la
          echo "Checking app..."
          ls -la app

      - name: Prepare Whisper
        run: |
          if [ -f "scripts/download_whisper_model.sh" ]; then
            chmod +x scripts/download_whisper_model.sh
            ./scripts/download_whisper_model.sh
          else
            echo "Whisper script not found"
          fi

      - name: Prepare llama.cpp
        run: |
          if [ -f "scripts/prepare_llama.sh" ]; then
            chmod +x scripts/prepare_llama.sh
            ./scripts/prepare_llama.sh
          else
            echo "llama.cpp script not found"
          fi

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LawOfflineAI-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
