name: Build LawOfflineAI PRO

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: android-actions/setup-android@v3
      - name: Install SDK and NDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - name: Download Whisper model
        run: bash scripts/download_whisper_model.sh
      - name: Download llama.cpp
        run: bash scripts/prepare_llama.sh
      - name: Gradle wrapper
        run: gradle wrapper --gradle-version 8.9
      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: LawOfflineAI-PRO-v3
          path: app/build/outputs/apk/debug/app-debug.apk
